# ═══════════════════════════════════════════════════════════════════════════════
# 可复用构建流程（被 ci.yml / release.yml 调用，自身不直接触发）
#
# 为什么要分「原生层」和「打包」两个 job：
#   1) 应用依赖 Yomori.RdpNative 编出来的 ycn_rdp.dll（FreeRDP 桥接层），
#      而那是**构建产物、没有入库**（.gitignore 掉了），GitHub 上必须自己编；
#   2) 它走 vcpkg 源码编译 FreeRDP，首次约 20-40 分钟 —— 所以做了两级缓存：
#        · 原生源码（CMakeLists / ycn_rdp.c / ycn_rdp.h）没变 → 直接复用 DLL，跳过 vcpkg；
#        · 源码变了 → vcpkg 依赖仍在缓存里，只需要重新编译链接（分钟级）。
#
# 打包为什么不直接用 `dotnet publish` 的输出：
#   WinUI 3 的 Yomori.pri 与各页面的 *.xbf（Views/、Themes/、embed/）只在 **build**
#   输出里；FreeRDP 那批运行库（freerdp3 / winpr3 / openssl / zlib / cjson）也是。
#   publish 目录里没有它们（实测），缺了程序起不来 / 页面打不开 ——
#   所以由 winui3/tools/package_release.py 把两边合并并做关键文件自检。
#
# 想在本机复现同一套流程（已实测）：见 winui3/README.md §三「GitHub Actions」。
# ═══════════════════════════════════════════════════════════════════════════════
name: build

on:
  workflow_call:
    inputs:
      version:
        description: 写入程序集版本（如 2.1.0，可带 -dev.1 这类后缀）。留空 = 最新正式版修订号 +1 再挂 -dev.<run_number>（如最新 v2.4.0 → 2.4.1-dev.412）
        type: string
        required: false
        default: ''
      self_contained:
        description: 是否把 .NET 运行时也打进包（true = 解压即用；false = 需要目标机装 .NET 8 运行时）
        type: boolean
        required: false
        default: true
      retention_days:
        description: 中间产物（未发布时）保留天数
        type: number
        required: false
        default: 14
    outputs:
      version:
        description: 实际使用的版本号（已去掉 v 前缀）
        value: ${{ jobs.package.outputs.version }}
      zip_name:
        description: 生成的 ZIP 文件名
        value: ${{ jobs.package.outputs.zip_name }}
      artifact_name:
        description: 上传的 artifact 名（供调用方下载）
        value: ${{ jobs.package.outputs.artifact_name }}
      # ⚠️ 少了这一条，调用方拿到的 setup_name 就是空字符串（job 级 output 不会自动透出）
      setup_name:
        description: 安装程序文件名（setup.exe；与绿色版 ZIP 一起上传）
        value: ${{ jobs.package.outputs.setup_name }}

permissions:
  contents: read

env:
  # 本机开发环境用的 vcpkg 就钉在这个提交上，它的 freerdp port 正是 3.32.0
  # （Yomori.RdpNative 是对着这个版本开发与真机验证的）。
  # 换提交 = 换 FreeRDP 版本，必须重新真机验收内嵌画面。
  VCPKG_COMMIT: 10541e317a660f4165ba4ac2851ab54a8d4577b1
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget

jobs:
  # ────────────────────────────────────────────────────────────── 原生层
  native:
    name: 原生层（FreeRDP 桥接 DLL）
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 还原原生层产物缓存
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: native-out
          key: ycn-native-v2-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-x64-windows-${{ hashFiles('winui3/native-deps/**', 'winui3/src/Yomori.RdpNative/CMakeLists.txt', 'winui3/src/Yomori.RdpNative/*.c', 'winui3/src/Yomori.RdpNative/*.h', 'winui3/src/Yomori.RdpNative/*.cmake', 'winui3/tests/fixtures/*', 'winui3/tests/*decode*.py', 'winui3/tests/gfx_caps_probe.*', 'winui3/tools/build_native.ps1', 'winui3/tools/verify_native_runtime.py', 'winui3/tools/package_release.py') }}

      - name: 还原固定依赖缓存
        id: vcpkg-cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .native-work/vcpkg-installed
            .native-work/vcpkg-downloads
          key: ycn-deps-v2-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-x64-windows-${{ hashFiles('winui3/native-deps/**') }}

      - name: 构建 FreeRDP FFmpeg 硬解依赖与桥接
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./winui3/tools/build_native.ps1 `
            -VcpkgRoot "$env:GITHUB_WORKSPACE/.vcpkg" `
            -WorkRoot "$env:GITHUB_WORKSPACE/.native-work" `
            -InstallRoot "$env:GITHUB_WORKSPACE/.native-work/vcpkg-installed" `
            -OutDir "$env:GITHUB_WORKSPACE/native-out"

      - name: 校验原生层（含缓存命中产物）
        shell: pwsh
        run: |
          python winui3/tools/verify_native_runtime.py --dir native-out `
            --require-ffmpeg --expect-hwaccel --expect-ycn-h264-api `
            --forbid-system-gpu --allow-vc-runtime-external --clean-load `
            --capabilities native-out/ycn_rdp.capabilities.json `
            --lock winui3/native-deps/native-deps.lock.json `
            --patches-dir winui3/native-deps/patches
          if ($LASTEXITCODE -ne 0) { throw '原生运行库验证失败' }
          python winui3/tests/native_decode_checks.py --dll native-out/ycn_rdp.dll --policy 2
          if ($LASTEXITCODE -ne 0) { throw '原生解码 ABI 验证失败' }
          python winui3/tests/h264_decode_probe.py --dll native-out/freerdp3.dll
          if ($LASTEXITCODE -ne 0) { throw '软件解码输出验证失败' }

      - name: 验证真实 GFX 能力包
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./winui3/tests/gfx_caps_probe.ps1 -SdkRoot "$env:GITHUB_WORKSPACE/.native-work/vcpkg-installed/x64-windows"

      - name: 保存固定依赖缓存
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true' && hashFiles('.native-work/vcpkg-installed/vcpkg/status') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .native-work/vcpkg-installed
            .native-work/vcpkg-downloads
          key: ycn-deps-v2-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-x64-windows-${{ hashFiles('winui3/native-deps/**') }}

      - name: 保存原生层产物缓存
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: native-out
          key: ycn-native-v2-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-x64-windows-${{ hashFiles('winui3/native-deps/**', 'winui3/src/Yomori.RdpNative/CMakeLists.txt', 'winui3/src/Yomori.RdpNative/*.c', 'winui3/src/Yomori.RdpNative/*.h', 'winui3/src/Yomori.RdpNative/*.cmake', 'winui3/tests/fixtures/*', 'winui3/tests/*decode*.py', 'winui3/tests/gfx_caps_probe.*', 'winui3/tools/build_native.ps1', 'winui3/tools/verify_native_runtime.py', 'winui3/tools/package_release.py') }}

      - name: 上传原生层产物
        uses: actions/upload-artifact@v4
        with:
          name: native-dlls
          path: |
            native-out/*.dll
            native-out/ycn_rdp.capabilities.json
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────── 编译 + 打包
  package:
    name: 编译 + 打包
    needs: native
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      zip_name: ${{ steps.pack.outputs.zip_name }}
      setup_name: ${{ steps.setup.outputs.setup_name }}
      artifact_name: app-package
    steps:
      # 版本号兜底要从已有的正式版 tag（vX.Y.Z）推算，所以这份 checkout 必须带全量 tag：
      # 默认 fetch-depth 1 是不取 tag 的，`git tag` 会返回空 → 又退回写死的号。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          # 调用方给了号就用（正式版发布）；没给就自己算（CI 测试版）。
          #
          # 测试版的版本号必须**永远大于最新正式版** —— 否则「检查更新」把测试版当成旧版：
          # 早先写死的 2.0.0-dev.<构建号>，在正式版过了 2.0 之后（v2.1.0 起）就永远比正式版小，
          # 于是装了测试版的人点检查更新只会看到「更旧」，装了正式版的人切到测试版通道也拿不到更新。
          #
          # 现在的规则：取已有正式版 tag 里最大的 vX.Y.Z，修订号 +1，
          # 再挂 -dev.<构建号>：v2.4.0 → 2.4.1-dev.412。下次发 v2.4.1 时 CI 自动变 2.4.2-dev.N，
          # 始终压住任何已发布的正式版。一份正式版都没发过时从 2.0.1 起。
          $v = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
          if ([string]::IsNullOrEmpty($v)) {
            $best = $null
            foreach ($t in (git tag --list 'v*')) {
              if ($t -match '^v(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.]+)?$') {
                $cand = [version]("{0}.{1}.{2}" -f $Matches[1], $Matches[2], $Matches[3])
                if (($null -eq $best) -or ($cand -gt $best)) { $best = $cand }
              }
            }
            $base = if ($best) { "{0}.{1}.{2}" -f $best.Major, $best.Minor, ($best.Build + 1) } else { "2.0.1" }
            $v = "$base-dev.${{ github.run_number }}"
            $latestLabel = if ($best) { "v$best" } else { "（还没有）" }
            Write-Host "最新正式版：$latestLabel"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "本次版本：$v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 还原 NuGet 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('winui3/src/Yomori.App/Yomori.App.csproj', 'winui3/src/Yomori.Agent/Yomori.Agent.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # 放回 csproj 期望的位置：它按 ..\Yomori.RdpNative\build\Release\ 拷 ycn_rdp.dll，
      # 而 CopyRdpRuntimeDlls 目标也从这里取 FreeRDP 运行库
      - name: 取原生层产物
        uses: actions/download-artifact@v4
        with:
          name: native-dlls
          path: winui3/src/Yomori.RdpNative/build/Release

      # UU 修复载荷：一个零依赖的 C 文件，每次现编。
      # 不进缓存，避免改了源码但缓存里还是旧 DLL（这个 DLL 会注入到别人进程里，
      # 版本错配的代价比多编十秒高得多）。产物按 csproj 期望的路径放回去。
      - name: 构建 UU 修复载荷
        shell: pwsh
        run: |
          cmake -S winui3/src/Yomori.UuFix.Native -B .uufix-build -A x64
          if ($LASTEXITCODE -ne 0) { throw "配置 UuFix 失败" }
          cmake --build .uufix-build --config Release
          if ($LASTEXITCODE -ne 0) { throw "构建 UuFix 失败" }

          $dst = 'winui3/src/Yomori.UuFix.Native/build/Release'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item '.uufix-build/Release/uu_session_fix.dll' $dst -Force

          $dll = Join-Path $dst 'uu_session_fix.dll'
          if (-not (Test-Path $dll)) { throw "UuFix 没有产出 uu_session_fix.dll" }
          Get-ChildItem $dst | Select-Object Name, Length

      - name: 编译（Release / x64）
        shell: pwsh
        run: |
          $outDir = (Join-Path $env:GITHUB_WORKSPACE 'ci-build').Replace('\', '/') + '/'
          dotnet build winui3/src/Yomori.App/Yomori.App.csproj `
            -c Release -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }} -p:OutDir=$outDir

          # 外置 UI 看门狗：独立进程，抓主控端假死现场。
          # 为什么单独一个工程：主控端 manifest 是 requireAdministrator（编译期静态、
          # 没法按参数豁免），共用同一个 exe 会让看门狗每次启动都弹 UAC。
          dotnet build winui3/src/Yomori.Watchdog/Yomori.Watchdog.csproj `
            -c Release -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }} -p:OutDir=$outDir

      - name: 发布（自包含，带 .NET 运行时）
        if: inputs.self_contained
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'ci-publish'
          dotnet publish winui3/src/Yomori.App/Yomori.App.csproj `
            -c Release -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }} `
            -r win-x64 --self-contained true -o $pub

      # 会话代理是**独立工程**，不引 WinUI / WindowsAppSDK：它只跑桥协议 + 任务执行，
      # 一辈子不开窗。复用主控端 exe 的代价是部署时必须把整个程序目录复制到
      # %ProgramData%\Yomori\agent（每台目标机 228MB，其中 128MB 是界面栈和 ONNX）。
      # 这里单独发布一份纯后台程序，约 73MB，铺进安装目录的 agent\。
      # 自包含开关与主控端保持一致：包装成"解压即用"，代理也不能要求另装运行时。
      - name: 发布会话代理（不含界面栈）
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'ci-agent'
          $extra = @()
          if ('${{ inputs.self_contained }}' -eq 'true') { $extra += @('-r', 'win-x64', '--self-contained', 'true') }
          dotnet publish winui3/src/Yomori.Agent/Yomori.Agent.csproj `
            -c Release -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }} @extra -o $pub
          if ($LASTEXITCODE -ne 0) { throw '代理工程发布失败' }
          if (-not (Test-Path (Join-Path $pub 'Yomori.Agent.exe'))) { throw '代理载荷里没有 Yomori.Agent.exe' }
          $mb = ((Get-ChildItem $pub -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host ("代理载荷 {0:N1} MB（主控端整套约 228MB）" -f $mb)

      - name: 校验 UU 修复载荷已进产物
        shell: pwsh
        run: |
          # csproj 对载荷用了 Exists 条件（本地没编也能编主控），
          # 所以必须在 CI 里单独确认它确实进了输出 —— 否则安装版点开关才报「找不到载荷」。
          $targets = @(Join-Path $env:GITHUB_WORKSPACE 'ci-build\uu_session_fix.dll')
          if ('${{ inputs.self_contained }}' -eq 'true') {
            $targets += Join-Path $env:GITHUB_WORKSPACE 'ci-publish\uu_session_fix.dll'
          }
          foreach ($f in $targets) {
            if (-not (Test-Path $f)) { throw "缺少 UU 修复载荷：$f" }
          }
          Get-ChildItem $targets | Select-Object FullName, Length

      - name: 打包（补齐 .pri / XBF / FreeRDP 运行库 / 图标 / 代理载荷 + 自检）
        id: pack
        shell: pwsh
        env:
          # Windows runner 的 Python 默认按 cp1252 输出，打印中文会 UnicodeEncodeError
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          $name = "Yomori-winui3-${{ steps.ver.outputs.version }}-x64"
          $argv = @(
            'winui3/tools/package_release.py',
            '--build-dir', 'ci-build',
            '--assets', 'assets',
            '--agent-dir', 'ci-agent',
            '--out', 'dist',
            '--name', $name,
            # 第三方组件（FreeRDP / WinPR / OpenSSL 等）的许可证原文从 CI 自己的
            # vcpkg 安装目录抓，生成 THIRD-PARTY-NOTICES.txt 打进包 —— Apache-2.0 §4
            # 要求分发时随附许可证副本。不传这个参数它会去啃本机路径然后失败。
            '--vcpkg-inst', '.vcpkg/installed/x64-windows',
            '--version', '${{ steps.ver.outputs.version }}'
          )
          if ('${{ inputs.self_contained }}' -eq 'true') { $argv += @('--publish-dir', 'ci-publish') }
          python @argv
          "zip_name=$name.zip" >> $env:GITHUB_OUTPUT

      # 绿色版 ZIP 之外再出一个安装版：装到 Program Files，开始菜单 + 卸载入口都有。
      # package_release.py 已经把要装的东西铺到 dist/app 了，这里直接打包它。

      # ⚠️ 版本要钉死，别再用 `choco install innosetup`（装到哪个版本全看包仓库心情）：
      #    1) 后面要改编译器模板 SetupLdr 的清单，模板布局随版本变；
      #    2) 「DisablePrecompiledFileVerifications」是 6.7 才有的指令。
      - name: 装 Inno Setup（钉死版本）
        shell: pwsh
        env:
          INNO_VERSION: '6.7.3'
        run: |
          $ver = $env:INNO_VERSION
          $tag = 'is-' + ($ver -replace '\.', '_')
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$ver.exe"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile innosetup.exe -UseBasicParsing
          Write-Host ("安装包大小 {0:N1} MB" -f ((Get-Item innosetup.exe).Length / 1MB))
          $p = Start-Process -FilePath (Resolve-Path innosetup.exe).Path -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS'
          if ($p.ExitCode -ne 0) { throw "Inno Setup 安装失败（exit $($p.ExitCode)）" }

          $dir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw "装完了却找不到 ISCC.exe：$dir" }
          Write-Host "Inno Setup 就位：$dir"

      # 让安装包在**双击的瞬间**就要求管理员，而不是「向导先出来、过一会儿再弹 UAC」。
      # 做法：把编译器模板 SetupLdr.e32/e64 的清单改成 requireAdministrator，再让 ISCC
      # 拿这套模板去拼安装包。改在复制出来的目录上做，Program Files 里的保持原样。
      # ⚠️ 不要改成「编好的 setup.exe 事后打补丁」：它尾部是追加的安装数据，
      #    mt.exe 和 UpdateResource 写回时会把那一段整段丢掉（75MB → 1MB 的残骸）。
      - name: 让安装包强制要求管理员（改编译器模板清单）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          $srcDir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          $work = Join-Path $env:GITHUB_WORKSPACE 'inno-patched'
          Copy-Item $srcDir $work -Recurse -Force

          $stubs = @('SetupLdr.e32', 'SetupLdr.e64') | ForEach-Object { Join-Path $work $_ }
          python winui3/tools/patch_setup_manifest.py @stubs
          if ($LASTEXITCODE -ne 0) { throw '编译器模板清单补丁失败（见上一行输出）' }
          "inno_dir=$work" >> $env:GITHUB_OUTPUT
        id: inno

      # 装版之前再核一遍"真的是自包含"。
      # package_release.py 已经查过 runtimeconfig，这里查的是**发布步骤本身有没有跑成** ——
      # 自包含 publish 失败时 step 会红，但那种情况下 CI 已经在上一条就断了；
      # 真正要防的是"有人把 self_contained 关掉却仍然发安装版"（目标机没 .NET 就双击不了）。
      - name: 确认安装版确实是自包含
        if: inputs.self_contained
        shell: pwsh
        run: |
          $cfg = 'dist/app/Yomori.runtimeconfig.json'
          if (-not (Test-Path $cfg)) { throw "缺少 $cfg —— 打包自检怎么放过的？" }
          $j = Get-Content $cfg -Raw | ConvertFrom-Json
          if (-not $j.runtimeOptions.includedFrameworks) {
            throw "dist/app 是框架依赖版（runtimeconfig 没有 includedFrameworks），不能当自包含安装版发出去"
          }
          $names = @($j.runtimeOptions.includedFrameworks | ForEach-Object { "$($_.name) $($_.version)" })
          Write-Host ('自包含确认 OK，内置运行时：' + ($names -join ', '))

      - name: 编译安装程序
        id: setup
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          $iscc = Join-Path '${{ steps.inno.outputs.inno_dir }}' 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe（Inno Setup 没装上？）：$iscc" }

          # 改名后的硬性前提：装到 {pf}\Yomori，且不许被旧安装目录顶掉。
          # UsePreviousAppDir 默认 yes，会把旧版登记过的 InstallLocation 盖在 DefaultDirName 上，
          # 结果新版本（AppId 没变，走升级）又装回 {pf}\YukinoChan —— 目录名和产品名脱节，
          # 卸载项 / 开始菜单 / 任务栏固定项全指向旧路径。整行精确匹配，防止被注释蒙过去。
          $issLines = Get-Content 'winui3/tools/installer.iss'
          if ($issLines -notcontains 'DefaultDirName={pf}\Yomori') {
            throw 'installer.iss 的 DefaultDirName 不是 {pf}\Yomori'
          }
          if ($issLines -notcontains 'UsePreviousAppDir=no') {
            throw 'installer.iss 缺 UsePreviousAppDir=no —— 从旧版升级会被装回 YukinoChan'
          }
          Write-Host '✅ 安装目录：{pf}\Yomori（且不让旧安装目录覆盖）'

          # 安装时自动部署会话代理的唯一落地点就是这个脚本里的 Exec。只在 C# 里加了
          # --deploy-agent 分支、忘了改 iss，功能等于不存在 —— 而且两边都不会报错，
          # 要等用户装完发现「代理未部署」才知道。宁可在编译前判红。
          if (-not ($issLines -match '--deploy-agent')) {
            throw 'installer.iss 里找不到 --deploy-agent：装完不会自动部署会话代理'
          }
          if (-not ($issLines -match 'ewWaitUntilTerminated')) {
            throw 'installer.iss 的部署调用没有等待结束 —— 会与后面的启动/卸载抢文件'
          }
          Write-Host '✅ 安装时自动部署会话代理：已接线'

          # 代理载荷按版本号跳过（2026-10-30）：主通配必须把 agent\* 排出去，否则
          # 「代理没变就不重铺 73MB」这件事根本没发生 —— 而两种写法都不会报错，
          # 只能等到有人量安装耗时才发现。Check 少了同理：条目还在，判据形同虚设。
          # ⚠️ 断言只认「Excludes 里出现 \agent\*」，别把整串写死：后来又加了
          #    uu_session_fix.dll，写死的锚点会误红（冒烟那边已经踩过一次）。
          if (-not ($issLines -match 'Excludes:\s*"[^"]*\\agent\\\*')) {
            throw 'installer.iss 的主通配没有排除 agent\*：代理载荷会被无条件重写'
          }
          if (-not ($issLines -match 'Check:\s*ShouldInstallAgent')) {
            throw 'installer.iss 里找不到 Check: ShouldInstallAgent：代理版本判据没接上'
          }
          # UU 修复载荷必须走 dontcopy：只要它回到安装列表，占用检查就会把
          # GameViewerService 列出来，用户又被逼着停服务（= 断远控）。
          if (-not ($issLines -match 'Excludes:\s*"[^"]*uu_session_fix\.dll')) {
            throw 'installer.iss 的主通配没有排除 uu_session_fix.dll：占用提示会回来'
          }
          if (-not ($issLines -match 'Flags:\s*dontcopy')) {
            throw 'installer.iss 里找不到 dontcopy：UU 修复载荷落盘链路没接上'
          }
          Write-Host '✅ 载荷落盘判据：代理按版本号、UU 修复按内容'

          # 代理端版本号的唯一来源是 csproj 的 <AgentVersion>，安装器靠它判断
          # 「{app}\agent 要不要重写」。读不到就判红：判据缺失时安装器会退回
          # 「每次都写」，等于静默退回旧行为，而这正是本次改动要消掉的东西。
          [xml]$agentProject = Get-Content 'winui3/src/Yomori.Agent/Yomori.Agent.csproj'
          $agentVersion = @($agentProject.Project.PropertyGroup.AgentVersion) |
            Where-Object { $_ } | Select-Object -First 1
          if (-not $agentVersion) { throw 'Yomori.Agent.csproj 里找不到 <AgentVersion>' }
          if ($agentVersion -notmatch '^\d+(\.\d+){1,3}$') {
            throw "AgentVersion 必须是纯点分数字（2.0.0 这种），实际是：$agentVersion"
          }
          Write-Host "✅ 代理端版本：$agentVersion"

          # 中文语言文件已随仓库入库（winui3/tools/lang/ChineseSimplified.isl）。
          #
          # ⚠️ 不要再改成「构建时下载」：以前从 issrc 的 Unofficial 目录拉，上游 2026-06-23
          #    把这个翻译提升为正式翻译并挪到了 Files\Languages\ 下，旧地址从此 404；
          #    而失败只打一条 warning，于是之后每一个安装包都是英文向导，长期没人发现。
          #    现在缺文件就判红 —— 界面语言不该取决于一次 HTTP 请求。
          $lang = Join-Path $env:GITHUB_WORKSPACE 'winui3\tools\lang\ChineseSimplified.isl'
          if (-not (Test-Path $lang)) { throw "缺少中文语言文件：$lang" }
          if ((Get-Item $lang).Length -lt 5000) { throw "中文语言文件内容不完整：$lang" }
          Write-Host "✅ 中文语言文件：$lang"

          # ⚠️ 一律传绝对路径：ISCC 会把相对路径按「脚本所在目录」解析
          # ⚠️ 别用 $args —— 那是 PowerShell 的自动变量，赋值会报错
          $isccArgs = @(
            'winui3/tools/installer.iss',
            "/DMyAppVersion=${{ steps.ver.outputs.version }}",
            "/DSrcDir=$(Join-Path $env:GITHUB_WORKSPACE 'dist\app')",
            "/DOutDir=$(Join-Path $env:GITHUB_WORKSPACE 'dist')",
            "/DIconFile=$(Join-Path $env:GITHUB_WORKSPACE 'assets\icon.ico')",
            "/DAgentVersion=$agentVersion",
            "/DLangFile=$lang"
          )
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（exit $LASTEXITCODE）" }

          "setup_name=Yomori-${{ steps.ver.outputs.version }}-setup.exe" >> $env:GITHUB_OUTPUT

      # 兜底断言：前面的模板补丁要是没生效（换版本、路径不对、ISCC 用了别处的模板），
      # 这里就当场判红 —— 免得发出去一个「双击不要求管理员」的安装包。
      - name: 校验安装包真的要求管理员权限
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'dist/Yomori-${{ steps.ver.outputs.version }}-setup.exe'
          if (-not (Test-Path $setup)) { throw "找不到安装包：$setup" }

          # 被 mt.exe / UpdateResource 毁掉的残骸只有 ~950KB（引导器本身），
          # 正常安装包会把整个程序目录压进去，差着两个数量级 —— 顺手挡一道。
          $mb = (Get-Item $setup).Length / 1MB
          Write-Host ("安装包大小 {0:N1} MB" -f $mb)
          if ($mb -lt 2) { throw "安装包只有 $mb MB，像是丢了尾部安装数据（引导器残骸）" }

          python winui3/tools/patch_setup_manifest.py $setup --expect-admin
          if ($LASTEXITCODE -ne 0) { throw '安装包清单不是 requireAdministrator —— 模板补丁没生效' }
          Write-Host '✅ 安装包清单：requireAdministrator'

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
